[workspace]
resolver = "2"
members = ["crates/core", "crates/tui", "crates/web", "crates/cli"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/loak7993-code/termagent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
  "sync",
  "io-util",
  "net",
  "fs",
  "signal",
] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termagent"
version = "0.1.0"
description = "A terminal AI coding agent for Termux (and any POSIX shell). Like opencode / codex / claude code, but tiny and Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "you" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
input = ["prompt_toolkit>=3.0"]

[project.scripts]
termagent = "termagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termagent*"]
